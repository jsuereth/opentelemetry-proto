syntax = "proto3";

package opentelemetry.proto.resource.v1;

import "opentelemetry/proto/common/v1/common.proto";

option csharp_namespace = "OpenTelemetry.Proto.Resource.V1";
option java_multiple_files = true;
option java_package = "io.opentelemetry.proto.resource.v1";
option java_outer_classname = "ResourceProto";
option go_package = "go.opentelemetry.io/proto/otlp/resource/v1";

// Resource information.
message Resource {
  // Set of attributes that describe the resource.
  // Attribute keys MUST be unique (it is not allowed to have more than one
  // attribute with the same key).
  // The behavior of software that receives duplicated keys can be unpredictable.
  repeated opentelemetry.proto.common.v1.KeyValue attributes = 1;

  // The number of dropped attributes. If the value is 0, then
  // no attributes were dropped.
  uint32 dropped_attributes_count = 2;

  // Set of entities that participate in this Resource.
  //
  // Note: keys in the references MUST exist in attributes of this message.
  //
  // Status: [Development]
  repeated opentelemetry.proto.common.v1.EntityRef entity_refs = 3;


  // Parent resources of the current resource.
  //
  // A parent resource is found in the `resource_dictionary` at the
  // top-level message for a signal, e.g. `ResourceProfiles`.
  //
  // A parent resource is an "owner" or "context" for the current resource.
  // For the purpose of identification or grouping, all attributes on a parent
  // may be used to group data on the current resource.
  //
  // For example, if the current resource is a "process", with attributes
  // `process.id`, etc. it may have a "parent" resource
  // that captures the `host` information, like `host.id`, `host.name`.
  //
  // A resource is allowed to have more than one parent. For example, a
  // process may be part of a `service``, but also part of a `host`.
  //
  // A parent relationship on a resource implies that same relationship for
  // every entity in the resource.
  //
  // Note: This is only used in the Profiling signal, today.
  //
  // Status: [Development]
  repeated int32 parent_resource_index = 4;
}
